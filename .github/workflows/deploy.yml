name: Deploy to AWS
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/project
            git fetch --all
            git reset --hard origin/main
            docker rm -f project-app || true
            docker build --no-cache -t project-app .
            docker run -d -p 80:3000 --restart always --name project-app project-app
            echo "Deployed: $(cat index.html | grep -o 'VELORA.*' | head -1)"